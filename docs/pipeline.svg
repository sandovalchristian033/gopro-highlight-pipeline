<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="940" height="470" fill="#ffffff"/>

  <text x="28" y="40" font-size="20" font-weight="700" fill="#111827">GoPro Highlight Pipeline</text>
  <text x="28" y="62" font-size="13" fill="#6b7280">Finds the action by reading embedded sensor telemetry — never by decoding pixels.</text>

  <!-- 1. INPUT -->
  <rect x="28" y="92" width="176" height="88" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="44" y="118" font-size="12" font-weight="700" fill="#374151">RAW FOOTAGE</text>
  <text x="44" y="139" font-size="12" fill="#6b7280">GoPro Hero 9 MP4</text>
  <text x="44" y="157" font-size="12" fill="#6b7280">multi-angle, ~20 files</text>
  <text x="44" y="172" font-size="11" fill="#9ca3af">ingest.py</text>

  <path d="M204 136 L242 136" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2. TELEMETRY -->
  <rect x="242" y="92" width="190" height="88" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="258" y="118" font-size="12" font-weight="700" fill="#3730a3">TELEMETRY</text>
  <text x="258" y="139" font-size="12" fill="#4338ca">accel + gyro @ ~200 Hz</text>
  <text x="258" y="157" font-size="12" fill="#4338ca">GPS @ ~18 Hz</text>
  <text x="258" y="172" font-size="11" fill="#818cf8">gpmf.py · telemetry.py</text>

  <path d="M432 136 L470 136" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3. SIGNALS -->
  <rect x="470" y="92" width="200" height="88" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="486" y="118" font-size="12" font-weight="700" fill="#3730a3">SIGNALS</text>
  <text x="486" y="139" font-size="12" fill="#4338ca">airtime · impact · crash</text>
  <text x="486" y="157" font-size="12" fill="#4338ca">roughness · turns · speed</text>
  <text x="486" y="172" font-size="11" fill="#818cf8">signals.py</text>

  <path d="M670 136 L708 136" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4. SCORE -->
  <rect x="708" y="92" width="204" height="88" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="724" y="118" font-size="12" font-weight="700" fill="#3730a3">ACTION SCORE</text>
  <text x="724" y="139" font-size="12" fill="#4338ca">composite curve</text>
  <text x="724" y="157" font-size="12" fill="#4338ca">peak detection</text>
  <text x="724" y="172" font-size="11" fill="#818cf8">escenas.py</text>

  <path d="M810 180 L810 214" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 5. SEGMENTATION (highlight) -->
  <rect x="28" y="214" width="884" height="112" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="46" y="240" font-size="12" font-weight="700" fill="#92400e">SEGMENTATION — where a clip actually starts and ends</text>
  <text x="46" y="262" font-size="12" fill="#b45309">Commit anchor — open where intensity climbs a real fraction toward the section peak, measured on the</text>
  <text x="46" y="279" font-size="12" fill="#b45309">continuous signal, never the total score. Valley split — long sections break at their quietest moment.</text>
  <text x="46" y="296" font-size="12" fill="#b45309">Tail anchor — close where intensity stops being sustained, not on a single flare-up.</text>
  <text x="46" y="315" font-size="11" fill="#d97706">segments.py · matching.py · ride.py</text>

  <!-- measured results -->
  <rect x="620" y="234" width="276" height="76" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="636" y="252" font-size="11" font-weight="700" fill="#92400e">DEAD TIME BEFORE ACTION (median)</text>
  <text x="636" y="272" font-size="11" fill="#6b7280">Hand-cut by rider</text>
  <text x="866" y="272" font-size="11" font-weight="600" fill="#6b7280" text-anchor="end">1.1 s</text>
  <text x="636" y="289" font-size="11" fill="#6b7280">System v1</text>
  <text x="866" y="289" font-size="11" font-weight="600" fill="#dc2626" text-anchor="end">5.1 s</text>
  <text x="636" y="306" font-size="11" fill="#111827">System now</text>
  <text x="866" y="306" font-size="11" font-weight="700" fill="#059669" text-anchor="end">2.3 s</text>

  <path d="M470 326 L470 358" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 6. RENDER -->
  <rect x="28" y="358" width="430" height="88" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="44" y="384" font-size="12" font-weight="700" fill="#166534">ASSEMBLY &amp; RENDER</text>
  <text x="44" y="405" font-size="12" fill="#15803d">script + on-screen text · music bed · intro/outro cards</text>
  <text x="44" y="423" font-size="12" fill="#15803d">ffmpeg render · output naming · cleanup</text>
  <text x="44" y="438" font-size="11" fill="#4ade80">shorts.py · audio.py · bookends.py · render.py</text>

  <path d="M458 402 L496 402" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 7. OUTPUT -->
  <rect x="496" y="358" width="416" height="88" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="512" y="384" font-size="12" font-weight="700" fill="#374151">OUTPUT</text>
  <text x="512" y="405" font-size="12" fill="#6b7280">review reel · vertical shorts · publish queue</text>
  <text x="512" y="423" font-size="12" fill="#6b7280">Claude Code skills: mtb-clips · mtb-editor</text>
  <text x="512" y="438" font-size="11" fill="#9ca3af">21 Python modules · thresholds tuned on real footage</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
