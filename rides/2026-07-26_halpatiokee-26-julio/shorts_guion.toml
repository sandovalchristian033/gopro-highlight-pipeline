# Guion escrito a mano el 17-ago-2026 mirando el material cuadro por cuadro.
#
# Igual que el ride del 19-jul: sin telemetria el plan no trae eventos, asi que
# los segundos salen de revisar el video, no de picos de acelerometro.
#
# Lo que se ve: persecucion detras de un rider de kit gris con mochila, un
# peralte de madera a los 6 s del short 1, y muchisimo skinny -- tablones del
# ancho de la llanta -- en los tres shorts.
#
# El short 3 es el bueno del ride y el motor no lo sabia: en el segundo 3 el
# rider de adelante se sale del rut y termina bajandose de la bici en el
# palmetto. Sin telemetria no hay forma de detectar eso (el acelerometro que lo
# marcaria esta en SU bici, no en la camara), asi que el texto automatico lo
# ignoraba por completo y abria con "still learning this trail".

[[shorts]]
order = 1
climax = "halpatiokee-26jul@27.4"
alt_hook = "one tire wide for the next mile"
lineas = [
  { t = 0.0,  texto = "he's way faster than me" },
  { t = 5.6,  texto = "up the bank" },
  { t = 11.6, texto = "and now it's all planks" },
  { t = 24.9, texto = "how fast do you ride skinnies?" },
]

[[shorts]]
order = 2
climax = "halpatiokee-26jul@93.5"
alt_hook = "the gap never got smaller"
lineas = [
  { t = 0.0,  texto = "still can't close the gap" },
  { t = 8.2,  texto = "boardwalk, no bailing out" },
  { t = 15.5, texto = "and he's still pulling away" },
  { t = 22.5, texto = "how would you ride these boards?" },
]

[[shorts]]
order = 3
climax = "halpatiokee-26jul@138.3"
alt_hook = "the rut ate him alive"
lineas = [
  { t = 0.0,  texto = "watch the guy ahead" },
  { t = 3.2,  texto = "the rut got him" },
  { t = 5.8,  texto = "he popped right back up" },
  { t = 15.0, texto = "ever been bucked out of a rut?" },
]
